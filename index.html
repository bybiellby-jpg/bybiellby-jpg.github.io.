<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>byte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma tela preta com retícula vermelha (igual à foto), brasas vermelhas subindo, cartão com banner em vídeo no topo e avatar sobreposto */
:root {
  --bg: #070506;
  --ink: #f2e4cc;
  --muted: #a8908a;
  --red: #ff1f2d;
  --red-deep: #8e0a12;
  --glass: rgba(18, 8, 9, 0.62);
  --line: rgba(255, 60, 70, 0.18);
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  overflow-x: hidden;
}
#bg { position: fixed; inset: 0; }
#bg img, #bg video { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
#bg::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, var(--shade, 0)); }
#embers { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.halftone {
  position: fixed; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(255, 31, 45, 0.16) 1.1px, transparent 1.6px);
  background-size: 7px 7px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 120%, #000 10%, transparent 65%);
  mask-image: radial-gradient(ellipse at 50% 120%, #000 10%, transparent 65%);
}
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 115%, rgba(255, 31, 45, 0.26), transparent 55%),
              radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.75));
}

/* Tela de entrada */
#gate {
  position: fixed; inset: 0; z-index: 10; width: 100%;
  display: grid; place-items: center;
  background: rgba(5, 3, 4, 0.86);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  cursor: pointer; border: 0; color: var(--ink); font: inherit; padding-inline: 16px;
  transition: opacity .8s ease, visibility .8s;
}
#gate span {
  font-family: var(--font-mono); font-size: clamp(13px, 2.4vw, 16px);
  letter-spacing: .32em; color: var(--red);
  text-shadow: 0 0 18px rgba(255, 31, 45, .6);
  animation: pulse 2.2s ease-in-out infinite;
}
#gate:focus-visible span { outline: 1px solid var(--red); outline-offset: 10px; }
#gate.gone { opacity: 0; visibility: hidden; }
@keyframes pulse { 50% { opacity: .3; } }

/* Palco */
.stage {
  position: relative; z-index: 1;
  min-height: 100%; display: grid; place-items: center;
  padding: 28px 16px; perspective: 1000px;
}
.card {
  width: min(460px, 100%);
  display: flex; flex-direction: column; align-items: center;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 22px; overflow: hidden;
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 30px 90px -25px rgba(0, 0, 0, .85), 0 0 60px -30px rgba(255, 31, 45, .5);
  transform-style: preserve-3d;
  transition: transform .25s ease-out;
}
.banner { position: relative; width: 100%; aspect-ratio: 640 / 272; max-width: 100%; background: #000; }
.banner video { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.85) contrast(1.05); }
.banner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(120, 0, 10, .15), transparent 40%, rgba(18, 8, 9, .95));
}
.body {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding: 0 24px 22px; margin-top: -58px; position: relative; z-index: 1;
}
.avatar {
  width: 112px; height: 112px; border-radius: 50%; overflow: hidden; background: var(--red-deep);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--red), 0 0 46px rgba(255, 31, 45, .55);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.name {
  margin: 0; font-family: var(--font-display); font-weight: 900;
  font-size: clamp(34px, 10vw, 46px); letter-spacing: -.02em; line-height: 1;
  color: var(--ink);
  text-shadow: 2px 0 0 var(--red), -2px 0 0 rgba(255, 31, 45, .35), 0 0 30px rgba(255, 31, 45, .45);
}
.handle { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.badge {
  position: relative; display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink); background: rgba(255, 31, 45, .12); border: 1px solid rgba(255, 31, 45, .35);
}
.badge svg { width: 12px; height: 12px; color: var(--red); }
.bio { min-height: 1.6em; margin: 0; max-width: 36ch; text-align: center; line-height: 1.6; }
.bio .caret { display: inline-block; width: 1px; height: 1.05em; margin-left: 2px; vertical-align: -2px; background: var(--red); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.stats {
  width: 100%; display: grid; grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat small { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.links { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.link {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px;
  color: var(--ink); text-decoration: none; cursor: pointer; font: 500 13px var(--font-body);
  background: rgba(255, 255, 255, .03); border: 1px solid var(--line);
  transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.link svg { width: 18px; height: 18px; color: var(--red); }
.link:hover, .link:focus-visible {
  transform: translateY(-3px); background: rgba(255, 31, 45, .14); border-color: rgba(255, 31, 45, .55);
  box-shadow: 0 12px 26px -12px rgba(255, 31, 45, .8); outline: none;
}
.link:focus-visible { box-shadow: 0 0 0 2px var(--red); }

.player {
  width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px;
  padding: 10px 12px; border-radius: 14px;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line);
}
.play {
  grid-row: span 2; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--bg); background: var(--red);
  box-shadow: 0 0 20px rgba(255, 31, 45, .45);
}
.play:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.play svg { width: 14px; height: 14px; }
.track { min-width: 0; display: flex; flex-direction: column; }
.track b { font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.bars i { width: 3px; height: 3px; border-radius: 2px; background: var(--red); transition: height .08s linear; }
.seek { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--red); height: 14px; cursor: pointer; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  transform: translate(-50%, 20px); opacity: 0;
  padding: 8px 14px; border-radius: 10px; font-family: var(--font-mono); font-size: 12px;
  background: var(--red); color: var(--bg); transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="halftone"></div>
<div class="vignette"></div>

<button id="gate" type="button" aria-label="Entrar no perfil"><span>[ clique para entrar ]</span></button>

<main class="stage">
  <article class="card" id="card">
    <div class="banner">
      <video id="banner" muted loop playsinline autoplay preload="auto" poster="banner.jpg" aria-hidden="true">
        <source src="banner.mp4" type="video/mp4">
      </video>
    </div>
    <div class="body">
      <div class="avatar"><img id="avatar" alt="Foto de perfil do byte"></div>
      <div class="who">
        <h1 class="name" id="name"></h1>
        <div class="handle" id="handle"></div>
      </div>
      <div class="badges" id="badges"></div>
      <p class="bio" id="bio" aria-live="polite"></p>
      <div class="stats" id="stats"></div>
      <nav class="links" id="links" aria-label="Redes"></nav>
      <div class="player">
        <button class="play" id="play" type="button" aria-label="Tocar música"></button>
        <div class="track"><b id="trackTitle"></b><small id="trackSub"></small></div>
        <div class="bars" id="bars" aria-hidden="true"></div>
        <div class="seek">
          <span id="cur">0:00</span>
          <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Posição da música">
          <span id="dur">0:00</span>
        </div>
      </div>
    </div>
  </article>
</main>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="metadata" loop></audio>

<script>
/* ============================================================
   EDITE AQUI — tudo do seu perfil fica neste objeto
   ============================================================ */
const CONFIG = {
  nome: "byte",
  handle: "@bybyteby",
  avatar: "avatar.jpg",
  bio: [
    "programador roblox há 4 anos",
    "já contribuí pra jogos com +350M de visitas",
    "scripting em luau, do servidor ao cliente"
    "I love Money"
  ],
  stats: [
    { valor: "4", rotulo: "anos de dev" },
    { valor: "350M+", rotulo: "visitas" },
    { valor: "Luau", rotulo: "linguagem" }
  ],
  badges: [
    { texto: "roblox dev", icone: "cube" },
    { texto: "scripter",   icone: "code" },
    { texto: "350M+",      icone: "spark" }
  ],
  links: [
    { nome: "Discord", icone: "chat", copiar: "bybyteby" },
    { nome: "Roblox",  icone: "cube", url: "https://www.roblox.com/user.aspx?username=BLSDsnow" },
    { nome: "GitHub",  icone: "code", url: "https://github.com/bybiellby-jpg" }
  ],
  fundo: {
    arquivo: "download (1).gif", // ex: "fundo.jpg", "fundo.gif" ou "fundo.mp4" — vazio = fundo preto com vermelho
    escurecer: 0.45,     // 0 = imagem original, 1 = totalmente preto (ajuda o cartão a aparecer)
    efeitos: true        // brasas e pontinhos vermelhos por cima do fundo (false = só a imagem)
  },
  musica: {
    titulo: "Lodi Dodi",
    artista: "Snoop Dogg",
    arquivo: "lodi-dodi.mp3",
    volume: 0.45
  }
};

/* ---------- ícones ---------- */
const ICONS = {
  chat:  '<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="9" cy="10.5" r="1.2" fill="currentColor"/><circle cx="15" cy="10.5" r="1.2" fill="currentColor"/>',
  cube:  '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M4 7.5l8 4.5 8-4.5 M12 12v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  code:  '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  spark: '<path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z" fill="currentColor"/>',
  ply:   '<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
  pause: '<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>'
};
const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.spark}</svg>`;
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- fundo personalizado ---------- */
if (CONFIG.fundo.arquivo) {
  const f = encodeURI(CONFIG.fundo.arquivo), bg = $("bg");
  const el = /\.(mp4|webm)$/i.test(f)
    ? Object.assign(document.createElement("video"), { src: f, muted: true, loop: true, autoplay: true, playsInline: true })
    : Object.assign(new Image(), { src: f, alt: "" });
  bg.appendChild(el);
  bg.style.setProperty("--shade", CONFIG.fundo.escurecer);
  if (!CONFIG.fundo.efeitos) {
    document.querySelector(".halftone").hidden = true;
    $("embers").hidden = true;
  }
}

/* ---------- montar cartão ---------- */
$("name").textContent = CONFIG.nome;
$("handle").textContent = CONFIG.handle;
$("avatar").src = CONFIG.avatar;
$("badges").innerHTML = CONFIG.badges.map(b => `<span class="badge">${svg(b.icone)}${b.texto}</span>`).join("");
$("stats").innerHTML = CONFIG.stats.map(s => `<div class="stat"><b>${s.valor}</b><small>${s.rotulo}</small></div>`).join("");
$("links").innerHTML = CONFIG.links.map((l, i) => l.copiar
  ? `<button class="link" type="button" data-i="${i}" aria-label="Copiar Discord ${l.copiar}" title="copiar ${l.copiar}">${svg(l.icone)}${l.nome}</button>`
  : `<a class="link" href="${l.url}" target="_blank" rel="noopener">${svg(l.icone)}${l.nome}</a>`
).join("");
$("trackTitle").textContent = CONFIG.musica.titulo;
$("trackSub").textContent = CONFIG.musica.artista;
$("play").innerHTML = svg("ply");
$("bars").innerHTML = "<i></i>".repeat(5);

/* ---------- copiar Discord ---------- */
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1700);
}
$("links").addEventListener("click", (e) => {
  const btn = e.target.closest("button.link"); if (!btn) return;
  const val = CONFIG.links[btn.dataset.i].copiar;
  try {
    navigator.clipboard.writeText(val).then(() => toast(`discord copiado: ${val}`), () => toast(`discord: ${val}`));
  } catch (_) { toast(`discord: ${val}`); }
});

/* ---------- bio digitando ---------- */
$("bio").textContent = CONFIG.bio[0];
function typeLoop() {
  const el = $("bio");
  if (reduce) return;
  let line = 0, pos = 0, del = false;
  const tick = () => {
    const txt = CONFIG.bio[line];
    pos += del ? -1 : 1;
    el.innerHTML = txt.slice(0, pos).replace(/</g, "&lt;") + '<span class="caret"></span>';
    let wait = del ? 26 : 50 + Math.random() * 50;
    if (!del && pos === txt.length) { del = true; wait = 1900; }
    else if (del && pos === 0) { del = false; line = (line + 1) % CONFIG.bio.length; wait = 400; }
    setTimeout(tick, wait);
  };
  tick();
}

/* ---------- inclinação do cartão ---------- */
if (!reduce && matchMedia("(pointer: fine)").matches) {
  const card = $("card");
  addEventListener("mousemove", (e) => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    card.style.transform = `rotateY(${x * 9}deg) rotateX(${-y * 9}deg)`;
  });
  document.addEventListener("mouseleave", () => card.style.transform = "");
}

/* ---------- brasas vermelhas ---------- */
const cv = $("embers"), ctx = cv.getContext("2d");
let W, H, D, parts = [];
function size() {
  D = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
  parts = Array.from({ length: Math.round(innerWidth / 11) }, () => spawn(true));
}
function spawn(any) {
  return { x: Math.random() * W, y: any ? Math.random() * H : H + 10,
    r: (Math.random() * 1.7 + .5) * D, v: Math.random() * .6 + .25,
    w: Math.random() * Math.PI * 2, life: Math.random() * .6 + .4 };
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";
  for (const p of parts) {
    p.y -= p.v * D; p.w += .02; p.x += Math.sin(p.w) * .4;
    const a = Math.max(0, p.y / H) * p.life;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    g.addColorStop(0, `rgba(255,150,150,${a})`);
    g.addColorStop(.4, `rgba(255,31,45,${a * .55})`);
    g.addColorStop(1, "rgba(150,0,10,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 7); ctx.fill();
    if (p.y < -20) Object.assign(p, spawn(false));
  }
  if (!reduce) requestAnimationFrame(draw);
}
addEventListener("resize", size); size(); draw();

/* ---------- música ---------- */
const audio = $("audio");
audio.src = CONFIG.musica.arquivo;
audio.volume = CONFIG.musica.volume;
let analyser, data;
function hookAnalyser() {
  if (analyser) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaElementSource(audio);
    analyser = ac.createAnalyser(); analyser.fftSize = 64;
    src.connect(analyser).connect(ac.destination);
    data = new Uint8Array(analyser.frequencyBinCount);
    if (ac.state === "suspended") ac.resume();
  } catch (_) { analyser = null; }
}
const fmt = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
function setIcon() {
  const on = !audio.paused;
  $("play").innerHTML = svg(on ? "pause" : "ply");
  $("play").setAttribute("aria-label", on ? "Pausar música" : "Tocar música");
}
function play() {
  hookAnalyser();
  audio.play().catch(() => toast("toque no play pra ouvir"));
}
$("play").addEventListener("click", () => audio.paused ? play() : audio.pause());
audio.addEventListener("play", setIcon);
audio.addEventListener("pause", setIcon);
audio.addEventListener("loadedmetadata", () => $("dur").textContent = fmt(audio.duration));
audio.addEventListener("timeupdate", () => {
  $("cur").textContent = fmt(audio.currentTime);
  if (!seeking && audio.duration) $("seek").value = audio.currentTime / audio.duration * 100;
});
let seeking = false;
$("seek").addEventListener("input", () => { seeking = true; $("cur").textContent = fmt($("seek").value / 100 * audio.duration); });
$("seek").addEventListener("change", () => { if (audio.duration) audio.currentTime = $("seek").value / 100 * audio.duration; seeking = false; });

(function bars() {
  const els = $("bars").children;
  const loop = () => {
    const on = !audio.paused;
    if (on && analyser) analyser.getByteFrequencyData(data);
    for (let k = 0; k < els.length; k++) {
      const v = on ? (analyser ? data[k * 3 + 1] / 255 : .3 + Math.random() * .5) : 0;
      els[k].style.height = 3 + v * 19 + "px";
    }
    requestAnimationFrame(loop);
  };
  loop();
})();

/* ---------- entrar ---------- */
$("gate").addEventListener("click", () => {
  $("gate").classList.add("gone");
  $("banner").play().catch(() => {});
  typeLoop();
  play();
}, { once: true });
</script>
</body>
</html>
